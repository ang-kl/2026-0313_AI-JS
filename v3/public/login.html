<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sign in &middot; takearoundabout.com</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f5f7fa;
        color: #1a3a5f;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.5;
      }
      main.card {
        max-width: 420px;
        width: 100%;
        background: #fff;
        border-radius: 12px;
        padding: 32px 28px;
        box-shadow: 0 4px 24px rgba(26, 58, 95, 0.08);
        text-align: center;
      }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
      p  { margin: 0 0 20px; color: #5a6b7d; font-size: 14px; }
      .widget {
        display: flex; justify-content: center;
        min-height: 48px; align-items: center; margin: 8px 0 4px;
      }
      .status { font-size: 13px; color: #b94a48; min-height: 18px; margin-top: 12px; }
      footer { margin-top: 24px; font-size: 12px; color: #8a9aa8; }
      footer a { color: #5a6b7d; text-decoration: none; }
      footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <h1>Restricted preview</h1>
      <p>v3.takearoundabout.com is a private preview. Sign in with Telegram to continue.</p>
      <div id="widget" class="widget" aria-live="polite"></div>
      <div id="status" class="status" role="status"></div>
      <footer>
        <a href="https://takearoundabout.com">takearoundabout.com</a>
      </footer>
    </main>
    <script>
      (async () => {
        const status = document.getElementById("status");
        const host   = document.getElementById("widget");
        const next   = new URLSearchParams(location.search).get("next") || "";
        try {
          const r = await fetch("/api/login-config", { credentials: "same-origin" });
          if (!r.ok) throw new Error("config " + r.status);
          const cfg = await r.json();
          if (!cfg.bot) throw new Error("no bot");

          // Build the auth callback URL. Telegram appends id/first_name/auth_date/hash
          // as query params - our /api/auth handler validates them and bounces to `next`.
          const authUrl = new URL("/api/auth", location.origin);
          if (next) authUrl.searchParams.set("next", next);

          const s = document.createElement("script");
          s.async = true;
          s.src = "https://telegram.org/js/telegram-widget.js?22";
          s.setAttribute("data-telegram-login", cfg.bot);
          s.setAttribute("data-size", "large");
          s.setAttribute("data-radius", "8");
          s.setAttribute("data-request-access", "write");
          s.setAttribute("data-auth-url", authUrl.toString());
          host.appendChild(s);
        } catch (err) {
          status.textContent =
            "Login is temporarily unavailable. Please try again shortly.";
        }
      })();
    </script>
  </body>
</html>

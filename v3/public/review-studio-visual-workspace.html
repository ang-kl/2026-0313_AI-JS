<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=/" />
  <title>Redirecting to V3</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px system-ui, sans-serif; color: #16202e; background: #f5f7fb; }
    main { max-width: 560px; padding: 24px; }
    a { color: #255fc7; font-weight: 700; }
  </style>
  <script>
    const target = location.protocol === 'file:' ? 'https://v3.takearoundabout.com/' : '/';
    location.replace(target);
  </script>
</head>
<body>
  <main>
    <h1>Opening the rebuilt V3 app</h1>
    <p>This standalone preview has been retired. Continue to <a href="https://v3.takearoundabout.com/">v3.takearoundabout.com</a>.</p>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>V3 Telegram Login</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #162033;
        --muted: #667085;
        --line: #cfd7e6;
        --paper: #f4f7fb;
        --panel: #ffffff;
        --blue: #245fd6;
        --orange: #c87422;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f4f7fb;
          --muted: #aab4c3;
          --line: #2d3542;
          --paper: #080a0d;
          --panel: #11151c;
          --blue: #77a7ff;
          --orange: #f2b84b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 18px;
        color: var(--ink);
        background:
          linear-gradient(90deg, rgba(36, 95, 214, 0.08) 1px, transparent 1px),
          linear-gradient(0deg, rgba(27, 139, 149, 0.05) 1px, transparent 1px),
          var(--paper);
        background-size: 32px 32px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 430px);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        box-shadow: 0 18px 42px rgba(22, 32, 51, 0.14);
        padding: 22px;
      }
      p.eyebrow {
        margin: 0 0 8px;
        color: var(--blue);
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.1;
        letter-spacing: 0;
      }
      p {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }
      #telegram-login {
        min-height: 48px;
        margin-top: 18px;
        display: flex;
        align-items: center;
      }
      .status {
        min-height: 24px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 12px;
      }
      .error {
        color: var(--orange);
        font-weight: 750;
      }
      a {
        color: var(--blue);
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="login-title">
      <p class="eyebrow">Private V3</p>
      <h1 id="login-title">Sign in with Telegram</h1>
      <p>V3 is gated while the agentic workflow is being shaped. Sign in with the authorised Telegram account to continue.</p>
      <div id="telegram-login" aria-label="Telegram login button"></div>
      <p id="status" class="status">Preparing Telegram login...</p>
    </main>

    <script>
      const statusEl = document.getElementById('status');
      const holder = document.getElementById('telegram-login');
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next') || '/';

      function setStatus(message, isError) {
        statusEl.textContent = message;
        statusEl.className = isError ? 'status error' : 'status';
      }

      function safeNextPath(value) {
        if (!value || !value.startsWith('/') || value.startsWith('//')) return '/';
        return value;
      }

      async function boot() {
        try {
          const res = await fetch('/api/login-config', { credentials: 'same-origin' });
          const data = await res.json();
          if (!res.ok || !data.bot) throw new Error(data.error || 'Telegram bot is not configured.');

          const script = document.createElement('script');
          script.async = true;
          script.src = 'https://telegram.org/js/telegram-widget.js?22';
          script.setAttribute('data-telegram-login', data.bot);
          script.setAttribute('data-size', 'large');
          script.setAttribute('data-radius', '8');
          script.setAttribute('data-auth-url', `/api/auth?next=${encodeURIComponent(safeNextPath(next))}`);
          script.setAttribute('data-request-access', 'write');
          holder.replaceChildren(script);
          setStatus('Use the Telegram button above to continue.', false);
        } catch (error) {
          setStatus(error.message || 'Could not prepare Telegram login.', true);
        }
      }

      boot();
    </script>
  </body>
</html>

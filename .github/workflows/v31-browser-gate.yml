name: v3.1 browser production gate

on:
  push:
    branches:
      - chatgpt/v3.1-production-gate-20260826
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v3.1/package-lock.json

      - name: Install v3.1 dependencies
        working-directory: v3.1
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: v3.1
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build v3.1
        working-directory: v3.1
        run: npm run build

      - name: Start v3.1 server
        working-directory: v3.1
        env:
          PORT: 4173
          NODE_ENV: test
        run: |
          npm start > /tmp/v31-server.log 2>&1 &
          echo $! > /tmp/v31-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v31-server.log
          exit 1

      - name: Run Chromium browser gate
        working-directory: v3.1
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/browser-gate.mjs

      - name: Show server log
        if: always()
        run: cat /tmp/v31-server.log || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-browser-gate-evidence
          path: |
            v3.1/test-results/
            /tmp/v31-server.log
          if-no-files-found: warn

      - name: Normalise final v3.1 package version
        if: success() && github.ref_name == 'chatgpt/v3.1-production-gate-20260826'
        working-directory: v3.1
        run: |
          if node -e "process.exit(require('./package.json').version === '3.1.0' ? 0 : 1)"; then
            echo "v3.1 package version already normalised"
            exit 0
          fi
          npm version 3.1.0 --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(v3.1): normalise package version"
          git push origin "HEAD:${GITHUB_REF_NAME}"
